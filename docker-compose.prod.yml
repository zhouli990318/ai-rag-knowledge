services:
  # ========== 基础设施 ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_rag_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./backups:/backups
    networks:
      - ai-rag-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2g}
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-rag-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redisdata:/data
    networks:
      - ai-rag-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # ========== 后端服务 ==========
  server:
    build:
      context: ./backend
      dockerfile: server/Dockerfile
    image: ${REGISTRY:-}${REGISTRY:+/}${PROJECT:-ai-rag}/server:${TAG:-latest}
    container_name: ai-rag-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${SERVER_JAVA_OPTS:--XX:+UseZGC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof}
      # 数据库（Docker 内部通信用容器名 + 5432）
      APP_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_rag_platform}
      APP_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_rag_platform}
      APP_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      # Redis
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # MCP Gateway（Docker 内部通信）
      APP_MCP_GATEWAY_BASE_URL: http://mcp-gateway:8092/api/v1/mcp
      # AI 模型 API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-placeholder}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-placeholder}
      # 应用配置
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:-SpringAiRagPlatform2024SecretKey}
      APP_DEFAULT_EMBEDDING_BASE_URL: ${APP_DEFAULT_EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-http://host.docker.internal:11434}}
      APP_DEFAULT_EMBEDDING_MODEL: ${APP_DEFAULT_EMBEDDING_MODEL:-bge-m3}
      APP_DEFAULT_EMBEDDING_DIMENSIONS: ${APP_DEFAULT_EMBEDDING_DIMENSIONS:-1024}
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - server-logs:/app/logs
    networks:
      - ai-rag-net
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-2g}
          cpus: "${SERVER_CPU_LIMIT:-2.0}"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  mcp-gateway:
    build:
      context: ./backend
      dockerfile: mcp-gateway/Dockerfile
    image: ${REGISTRY:-}${REGISTRY:+/}${PROJECT:-ai-rag}/mcp-gateway:${TAG:-latest}
    container_name: ai-rag-mcp-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--XX:+UseZGC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof}
      APP_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_rag_platform}?schema=mcp_gateway
      APP_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_rag_platform}
      APP_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - gateway-logs:/app/logs
    networks:
      - ai-rag-net
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT:-1g}
          cpus: "${GATEWAY_CPU_LIMIT:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ========== 前端 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-}${REGISTRY:+/}${PROJECT:-ai-rag}/frontend:${TAG:-latest}
    container_name: ai-rag-frontend
    depends_on:
      server:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ai-rag-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  server-logs:
  gateway-logs:

networks:
  ai-rag-net:
    driver: bridge