server:
  port: 8091

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5442/ai_rag_platform}
    username: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 禁用 Spring AI 自动配置的默认模型（我们通过工厂动态创建）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder}
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:placeholder}
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true

# Redis (Redisson)
redis:
  sdk:
    config:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}

# 应用配置
app:
  crypto:
    secret-key: ${APP_CRYPTO_KEY:SpringAiRagPlatform2024SecretKey}
  mcp-gateway:
    base-url: ${APP_MCP_GATEWAY_BASE_URL:http://localhost:8092/api/v1/mcp}
  default-embedding:
    base-url: ${APP_DEFAULT_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${APP_DEFAULT_EMBEDDING_MODEL:nomic-embed-text}
    dimensions: ${APP_DEFAULT_EMBEDDING_DIMENSIONS:768}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}

logging:
  level:
    "[com.silver.ai]": DEBUG
    "[org.springframework.ai]": debug
