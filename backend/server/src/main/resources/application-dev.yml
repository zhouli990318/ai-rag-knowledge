server:
  port: 8091

spring:
  r2dbc:
    url: ${APP_R2DBC_URL:r2dbc:postgresql://localhost:5442/ai_rag_platform}
    username: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:123456}

  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5442/ai_rag_platform}
    username: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5442/ai_rag_platform}
    user: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:123456}
  http:
    codecs:
      max-in-memory-size: 100MB

  # Spring AI 模型自动配置已在 AiRagApplication 中排除，所有 AI 厂商通过页面配置动态管理
  ai:
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true

# Redis (Redisson)
redis:
  sdk:
    config:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}

# 应用配置
app:
  crypto:
    secret-key: ${APP_CRYPTO_KEY:SpringAiRagPlatform2024SecretKey}
  mcp-gateway:
    base-url: ${APP_MCP_GATEWAY_BASE_URL:http://localhost:8092/api/v1/mcp}
  default-embedding:
    base-url: ${APP_DEFAULT_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${APP_DEFAULT_EMBEDDING_MODEL:bge-m3}
    dimensions: ${APP_DEFAULT_EMBEDDING_DIMENSIONS:1024}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}

logging:
  level:
    "[com.silver.ai]": DEBUG
    "[org.springframework.ai]": debug
