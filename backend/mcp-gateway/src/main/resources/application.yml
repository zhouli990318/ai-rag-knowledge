spring:
  application:
    name: mcp-gateway
  profiles:
    active: dev,local
  main:
    web-application-type: reactive

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[default_schema]": mcp_gateway
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: mcp_gateway
    baseline-on-migrate: true

  ai:
    mcp:
      server:
        name: mcp-gateway
        version: 2.0.0

app:
  mcp:
    sse-path: ${APP_MCP_SSE_PATH:/sse}
    streamable-http-path: ${APP_MCP_STREAMABLE_HTTP_PATH:/mcp/message}
    session:
      ttl: ${APP_MCP_SESSION_TTL:PT30M}
      cleanup-interval: ${APP_MCP_SESSION_CLEANUP_INTERVAL:PT5M}
      allowed-passthrough-headers:
        - X-Request-Id
        - X-Correlation-Id
        - Traceparent
        - Tracestate
        - Accept-Language
        - User-Agent
      blocked-passthrough-headers:
        - Authorization
        - Cookie
        - Host
        - Content-Length
        - Connection
        - Transfer-Encoding
